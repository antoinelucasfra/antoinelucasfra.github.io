project:
  type: website
  output-dir: docs
  render:
    - "index.qmd"
    - "about.qmd"
    - "now.qmd"
    - "blog.qmd"
    - "cv.qmd"
    - "cv-typst.qmd"
    - "projects.qmd"
    - "posts/**/*.qmd"
    - "projects/**/*.qmd"
    - "topics/**/*.qmd"

quarto-required: ">=1.9.37"

website:
  title: "Antoine Lucas"
  description: "R and Shiny product engineering, statistical computing, and ML systems in scientific and regulated environments. Portfolio, blog, and projects."
  favicon: assets/images/favicon.svg
  image: assets/images/profile-pic.jpg
  site-url: https://antoinelucasfra.github.io
  repo-url: https://github.com/antoinelucasfra/antoinelucasfra.github.io
  repo-actions: [edit, issue]
  open-graph: true
  page-navigation: true
  back-to-top-navigation: true
  page-footer:
    border: true
    left: |
      Powered by [Quarto](https://quarto.org).
    center: |
      &copy; 2026 Antoine Lucas.
    right: |
      [RSS](/blog.xml){.bi .bi-rss-fill aria-label="RSS feed"} · License: [CC BY NC SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0).
  navbar:
    title: "Antoine Lucas"
    search: true
    background: dark
    left:
      - text: Blog
        menu:
          - text: All Posts
            href: blog.qmd
          - text: Now
            href: now.qmd
          - text: "---"
          - text: R & Shiny
            href: topics/r-shiny.qmd
          - text: Reproducibility & DevOps
            href: topics/reproducibility.qmd
          - text: Python & AI
            href: topics/python-ml.qmd
      - text: Projects
        href: projects.qmd
      - text: CV
        href: cv.qmd
      - text: About
        href: about.qmd
    right:
      - icon: linkedin
        href: "https://www.linkedin.com/in/antoinelucasdata/"
        aria-label: LinkedIn
      - icon: github
        href: "https://github.com/antoinelucasfra"
        aria-label: GitHub

format:
  html:
    grid:
      body-width: 1000px
    theme:
      light:
        - cosmo
        - assets/stylesheets/al-brand-light.scss
      dark:
        - cosmo
        - assets/stylesheets/al-brand-dark.scss
    lang: en
    date-format: "MMMM D, YYYY"
    highlight-style: dracula
    code-copy: true
    code-link: true
    code-overflow: wrap
    code-annotations: hover
    anchor-sections: true
    link-external-newwindow: true
    fig-align: center
    toc: true

lightbox: auto

execute:
  freeze: auto
