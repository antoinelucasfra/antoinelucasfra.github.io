# Compatible with `pre-commit` and `prek` (https://prek.j178.dev).
# R:      air (format) + jarl (lint)
# Python: ruff (format + lint) + uv (lockfile sync)
exclude: '^(renv|\.venv|venv|packrat|\.git)/'

repos:
  - repo: https://github.com/posit-dev/air-pre-commit
    rev: 0.10.0
    hooks:
      - id: air-format

  - repo: https://github.com/etiennebacher/jarl-pre-commit
    rev: 0.5.0
    hooks:
      - id: jarl-check

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-format
      - id: ruff-check

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.29
    hooks:
      - id: uv-lock
