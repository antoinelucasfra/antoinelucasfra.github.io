  what_i_do:
    - title: R Shiny & internal products
      body: >
        I design and ship internal tools for scientific teams: modular R Shiny apps, reporting workflows, and data interfaces that people can use without needing a walkthrough every time.
    - title: Architecture, quality & delivery
      body: >
        Architecture, documentation, validation, deployment, support. Scientific software routinely outlives the deadline that funded it, so maintainability is the default rather than a later phase.
    - title: Statistical modeling & analysis
      body: >
        Design of experiments, mixed models, biostatistics in GxP environments. I take raw assay data through to the interpretation that goes into a regulatory submission.
    - title: Reproducible engineering & MLOps
      body: >
        Everything in Git, runnable six months later with uv sync or rv sync, documented well enough that someone else can take it over. CI/CD, containers, pinned environments, and the evidence GxP qualification asks for.
    - title: AI-augmented scientific software
      body: >
        I build agentic workflows around the tools themselves: MCP servers and tool-calling
        agents that run statistical analysis on demand, AI-assisted coding and review, and
        tests that keep the result honest. Validation and review stay in place.
    - title: ML when it is the right tool
      body: >
        Computer vision, NLP pipelines, LLM-assisted extraction for scientific applications. I like building ML systems, but I like shipping the right product more than fitting a model into a problem that does not need one.
  selected_proof:
    - title: "Sovereign Local AI: bilingual book"
      href: https://antoinelucasfra.github.io/localai-review/
      description: a French/English book on running AI on your own hardware, written so the recipes stay runnable and the claims stay sourced.
    - title: "Case Study: Agentic Stats (MCP)"
      href: /projects/agentic-stats.html
      description: MCP server and FastAPI app exposing typed statistical tools to LLM agents. One implementation, two transports, tests.
    - title: "Case Study: Capacity Planning Platform"
      href: /posts/shiny-capacity-platform/
      description: how I built an R Shiny platform for global manufacturing resource planning, and the trade-offs along the way.
    - title: Engineering Standards for Scientific Software
      href: /posts/engineering-standards-scientific-software/
      description: how I think about tests, documentation, CI/CD, handover, and technical training.
    - title: Reproducible Environments for Everyone
      href: /posts/devcontainers-reproducible-environments/
      description: devcontainers, onboarding, and what keeps environments reproducible across a team.
    - title: Resources Catalog
      href: /catalog/
      description: 1200 curated data-science resources, tagged and searchable, with the workflow that keeps them current.
  work_principles:
    - label: End-to-end ownership.
      body: I frame the problem, choose an architecture, build it, validate it, deploy it, and keep it running.
    - label: Quality by default.
      body: Tests, documentation, reproducibility, and honest trade-offs, not it works on my machine.
    - label: Handover is part of the job.
      body: Mentoring, internal training, and documentation are built in, not bolted on.
    - label: Staying close to users.
      body: Workshops and iteration with the scientists, analysts, and operational teams who use the tools.

about:
  story:
    - >
      I did not start out planning to become a data scientist. I studied agronomy engineering at Institut Agro - Agrocampus Ouest in Rennes, which is fundamentally about applying science to complex living systems, and during my statistics courses I realised that the analytical side was what excited me most. What I wanted was to understand why a method works, and what it can and cannot tell you about the real world.
    - >
      After finishing both my engineering degree and a master's in applied mathematics and statistics in 2021, I joined Astek / IT&M Stats, a consultancy that places statisticians and data scientists inside large R&D organisations. That structure shaped how I work: missions from a few months to nearly two years, each with a new domain, a new team, and a new set of constraints. You get good at context-switching, and at building things that still work when you are not in the room to explain them.
    - >
      My first mission was at L'Oréal R&I: two years of clinical biostatistics on ingredient efficacy and molecular safety studies. I covered hundreds of analyses, learned what a two-week turnaround really means under pressure, and built internal tooling that helped the team move faster. It was a good introduction to regulated science, the kind of work where you cannot hand-wave uncertainty.
    - >
      Then Sanofi R&D, where I shifted from pure analysis to building. I designed and shipped a full R Shiny platform to predict and simulate manufacturing plant resource capacity across global sites, driving drug production planning and decision-making, while also taking on the Scrum Master role. That project taught me that useful software is harder to build than merely correct software, and that documentation, workshops, UAT, and handover are part of engineering rather than tasks that happen after it.
    - >
      After Sanofi came Abolis, a microbiome biotech startup. Six months, full autonomy, multi-omics data pipelines, no hand-holding. Very different energy from a pharma company, and a useful reminder that speed only helps when the foundations are still clear.
    - >
      Now I am at Chanel Parfums Beauté R&D, working on machine learning, R Shiny applications, and internal data products for fragrance and cosmetics development. It is the most technically ambitious role so far: production models, app catalogs, platform tooling, and software that scientists depend on daily.
    - >
      Outside work, I follow One Piece with unreasonable commitment, still make time for video games when I can, and have a lot of time for people who can say "I was wrong about that" and simply update their view.
  work_focus:
    - label: Working at the interface, not the edges.
      body: >
        The most useful position is between the domain experts and the data and software systems. People who sit purely on one side often build the wrong things. My agronomy background helps here because I can read a protocol, understand an experimental design, and push back when the question being asked cannot be answered with the data available.
    - label: Tooling that disappears.
      body: >
        The best internal tools are the ones that become invisible because people can just use them. A dashboard that requires a walkthrough every time is a failed tool. I spend a lot of time thinking about UX in scientific apps and internal platforms where it is usually ignored.
    - label: Documentation is part of the product.
      body: >
        If a tool only works when its original developer is around, it is not finished. I like writing the things that make software survivable: runbooks, architecture notes, qualification-oriented checks, reusable templates, and onboarding material.
    - label: Rigor over speed, mostly.
      body: >
        Working in pharma and cosmetics R&D means results matter in practical ways: regulatory submissions, manufacturing decisions, and product formulas. I have developed a healthy caution about overfitting, about p-values, and about claims that outrun the data.
    - label: Understanding the models I use.
      body: >
        I am drawn to the mathematical and statistical machinery underneath the tools I use, because understanding assumptions, failure modes, and trade-offs makes the judgment calls better.
    - label: Teaching scales teams.
      body: >
        I enjoy turning "this only exists in one person's head" into something a team can reuse through internal training, mentoring, and technical writing.
    - label: Explainability and the limits of black boxes.
      body: >
        In regulated R&D, a model you cannot explain is often a model you cannot use. Beyond compliance, I am genuinely interested in interpretable ML and AI as a more honest representation of what we actually know.
    - label: Staying current without being credulous.
      body: >
        I keep an active scientific watch across biostatistics, computational biology, and ML engineering. The field moves fast enough that distinguishing between durable tools and interesting experiments requires deliberate effort.
    - label: Open source tools and reproducible workflows.
      body: >
        R, Python, Quarto, Git, Docker. Reproducibility is how you avoid the slow-motion failure of work nobody can reconstruct six months later.
    - label: Remote collaboration requires explicitness.
      body: >
        I work well asynchronously, but I do not confuse remote work with silence. Clear writing, structured decisions, screen-sharing when useful, and explicit feedback loops matter a lot in distributed teams.

summary:
  cv: >
    Research engineer with 5+ years turning R&D problems into production software in pharma,
    cosmetics, and biotech. Maintain 20+ R Shiny applications used daily by researchers, plus
    statistical modelling (design of experiments, mixed models, multi-omics) and
    GxP-qualifiable delivery with tests, CI/CD and containers. Build LLM agents and MCP
    servers that put typed statistical tools in a model's hands.
  cv_biostat: >
    Biostatistician and data scientist with 5+ years in clinical, cosmetic, and microbiome R&D.
    Write statistical analysis plans and analysis methodologies, program them in R, and carry
    the results through blind review to study reports. Methods cover design of experiments,
    mixed models, and multivariate and multi-omics analysis, delivered with the engineering
    that makes them reproducible: Git, tests, CI/CD, containers.

