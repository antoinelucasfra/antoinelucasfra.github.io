# Quarto site CI: validate on pull requests, publish on pushes to prod.
# R dependencies are restored with rv for reproducibility.

name: Site

on:
  push:
    branches: [prod]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          version: 1.9.37

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 4.5.2
          use-public-rspm: true

      # rv is a standalone Rust CLI shipped through GitHub releases, not an R
      # package. Pinned and checksum-verified so the toolchain cannot drift.
      - name: Install rv
        env:
          RV_VERSION: v0.23.1
          RV_SHA256: 2b4064af50840f2902038928650d750f27f0e112032f2f37e42baa825b7ae814
        run: |
          curl -sSLo /tmp/rv.tar.gz \
            "https://github.com/A2-ai/rv/releases/download/${RV_VERSION}/rv-${RV_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${RV_SHA256}  /tmp/rv.tar.gz" | sha256sum -c -
          tar -xzf /tmp/rv.tar.gz -C /tmp
          sudo install -m 0755 /tmp/rv /usr/local/bin/rv
          rv --version

      # The P3M URL in rproject.toml serves sources on Linux, so packages with
      # system-library requirements get compiled here. Let rv name the ones it
      # knows about, then add what pak needs to build its embedded `curl`,
      # `cli` and `zip` copies (rv installs pak itself, so it comes first).
      - name: Install system dependencies for R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            $(rv sysdeps --only-absent) \
            libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Restore R dependencies with rv
        run: rv sync

      - name: Check the CV variant overlay
        run: Rscript _helpers/test-profile-variant.R

      - name: Render Quarto project
        run: quarto render

      - name: Verify published surface
        run: |
          test ! -e docs/TODO.html
          test ! -e docs/CONTRIBUTING.html
          ! grep -Eq 'TODO\.html|CONTRIBUTING\.html' docs/search.json docs/sitemap.xml docs/listings.json

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
