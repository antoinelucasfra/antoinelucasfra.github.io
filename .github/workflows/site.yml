# Quarto site CI: validate on pull requests, publish on pushes to main.
# R dependencies are restored with rv for reproducibility.

name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          version: 1.9.37

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 4.5.2
          use-public-rspm: true

      - name: Install rv
        run: install.packages("rv", repos="https://packagemanager.posit.co/cran/latest")

      - name: Restore R dependencies with rv
        run: rv sync

      - name: Render Quarto project
        run: quarto render

      - name: Verify published surface
        run: |
          test ! -e docs/TODO.html
          test ! -e docs/CONTRIBUTING.html
          ! grep -Eq 'TODO\.html|CONTRIBUTING\.html' docs/search.json docs/sitemap.xml docs/listings.json

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
