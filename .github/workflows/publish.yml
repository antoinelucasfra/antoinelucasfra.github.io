# Quarto site CI: validate on pull requests, publish on pushes to prod.
# R dependencies come from renv.lock; see README.md for the local dev loop.

name: Site

on:
  push:
    branches: [prod]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cheap and fail-fast: the covers are generated from post frontmatter, so a
      # title edit that never regenerated its cover is caught here rather than by
      # a reader noticing a stale thumbnail.
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check post covers are current
        run: uv run --project scripts python scripts/make_covers.py --check

      # Runner images are mid-migration (Quarto present in some snapshots,
      # absent in others), and the official quarto-actions setup still apt-
      # installs pinned versions, which trips the downgrade guard. Install a
      # pinned .deb with dpkg instead: deterministic, checksum-verified, and
      # dpkg has no downgrade guard. `quarto-required` in _quarto.yml gates the
      # version floor as a backstop. (The official ghcr.io/quarto-dev/quarto
      # image exists but is Quarto-only; rocker/verse bundles an older Quarto.)
      - name: Install Quarto
        run: |
          wget -q https://github.com/quarto-dev/quarto-cli/releases/download/v1.9.37/quarto-1.9.37-linux-amd64.deb
          echo "98aad03c8ce11705caa7c48b8f6ea59f6ab02d1579e754ddb530c0f2e7b471c6  quarto-1.9.37-linux-amd64.deb" | sha256sum -c -
          sudo dpkg --force-downgrade -i quarto-1.9.37-linux-amd64.deb
          quarto --version

      # The R version comes from renv.lock, so CI and local development run the
      # same R. Bump it in the lockfile, not here. `use-public-rspm` points renv
      # at Posit Package Manager binaries; the dated snapshot in .Rprofile makes
      # locked versions stay downloadable.
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      # After the 2026-10 lockfile prune (143 -> 63 packages), every package
      # resolves to a PPM Linux binary for the dated snapshot, so nothing
      # compiles from source and no system dev libraries are needed. If a future
      # restore fails to compile something, add just the library its error names.

      - name: Restore R dependencies from renv.lock
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 2

      # Add R packages here when the render needs something that is not in
      # renv.lock. Anything captured with `renv::snapshot()` is restored by the
      # step above; `any::` accepts whatever version is already installed.
      - name: Install extra R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::quarto
            any::rmarkdown

      - name: Render Quarto project
        run: quarto render

      - name: Verify published surface
        run: |
          test ! -e docs/TODO.html
          test ! -e docs/CONTRIBUTING.html
          ! grep -Eq 'TODO\.html|CONTRIBUTING\.html' docs/search.json docs/sitemap.xml docs/listings.json
          test -f docs/cv/index.html
          test -f docs/cv/ai.html
          test -f docs/cv/biostat.html
          test -f docs/cv/cv.pdf
          test -f docs/cv/cv-biostat.pdf
          test -s docs/llms.txt
          grep -q '^Sitemap: ' docs/robots.txt

      - name: Keep the pre-reorganisation CV URLs alive
        # /cv.pdf, /cv-ai.html, /cv-biostat.html and /cv.html are linked from
        # LinkedIn, mail signatures and older job-search letters. The CV now
        # renders under /cv/, so publish copies and redirect stubs at the paths
        # those links still point at.
        run: |
          cp docs/cv/cv.pdf docs/cv.pdf
          cp docs/cv/cv-biostat.pdf docs/cv-biostat.pdf
          cp docs/cv/cv.pdf docs/Antoine-Lucas-CV-AI.pdf
          cp docs/cv/cv-biostat.pdf docs/Antoine-Lucas-CV-Biostat.pdf
          printf '<!doctype html>\n<meta http-equiv="refresh" content="0; url=/cv/">\n' > docs/cv.html
          printf '<!doctype html>\n<meta http-equiv="refresh" content="0; url=/cv/ai.html">\n' > docs/cv-ai.html
          printf '<!doctype html>\n<meta http-equiv="refresh" content="0; url=/cv/biostat.html">\n' > docs/cv-biostat.html
          # The resources catalog moved to its own project and site; /catalog/
          # is linked from older posts and external notes.
          mkdir -p docs/catalog
          printf '<!doctype html>\n<meta http-equiv="refresh" content="0; url=https://antoinelucasfra.github.io/resources-catalog/">\n' > docs/catalog/index.html
          test -f docs/cv.pdf && test -f docs/cv-biostat.pdf && test -f docs/cv.html && test -f docs/Antoine-Lucas-CV-AI.pdf && test -f docs/Antoine-Lucas-CV-Biostat.pdf && test -f docs/catalog/index.html

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
