# GitHub Actions Workflow for Quarto Publish
# This workflow builds and deploys a Quarto website to GitHub Pages
# It uses renv to restore R dependencies from the lockfile for reproducibility

name: Publish Quarto Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          version: 1.9.37

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 4.5.2
          use-public-rspm: true

      - name: Setup renv
        uses: r-lib/actions/setup-renv@v2

      - name: Render Quarto Project
        run: quarto render

      - name: Verify published surface
        run: |
          test ! -e docs/TODO.html
          test ! -e docs/CONTRIBUTING.html
          test ! -d docs/sandbox
          ! grep -Eq 'TODO\.html|CONTRIBUTING\.html|sandbox/' docs/search.json docs/sitemap.xml docs/listings.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
