name: Validate Quarto Site

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          version: 1.9.37

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 4.5.2
          use-public-rspm: true

      - name: Install rv
        run: install.packages("rv", repos="https://packagemanager.posit.co/cran/latest")

      - name: Restore R dependencies with rv
        run: rv sync

      - name: Render Quarto project
        run: quarto render

      - name: Verify published surface
        run: |
          test ! -e docs/TODO.html
          test ! -e docs/CONTRIBUTING.html
          test ! -d docs/sandbox
          ! grep -Eq 'TODO\.html|CONTRIBUTING\.html|sandbox/' docs/search.json docs/sitemap.xml docs/listings.json
