# Migrated from renv.lock on 2026-07-18.
# rv resolves to the current CRAN/P3M versions: the exact versions pinned in
# renv.lock are no longer served by PPM /cran/latest, so a 1:1 restore is impossible
# (renv::restore() would also fail today). rv.lock pins the resolved versions.
[project]
name = "antoinelucasfra.github.io"
 r_version = "4.5.2"

repositories = [
    { alias = "P3M", url = "https://packagemanager.posit.co/cran/latest" },
    { alias = "CRAN", url = "https://cloud.r-project.org/" },
]

